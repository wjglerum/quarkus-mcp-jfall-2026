version: 2
# Paused for J-Fall (12 November 2026): open-pull-requests-limit 0 stops new
# version-update pull requests. Restore 5 (maven) and 2 (github-actions) to resume.
updates:
  - package-ecosystem: maven
    # One entry per module: each module pins its own versions, so the root
    # aggregator alone only gets one of them bumped.
    directories:
      - /conference-api
      - /conference-mcp
      - /conference-chat
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    # Bundle every Maven bump, across all modules, into one pull request.
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
